<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem SPP - Santo Bernardus</title>
    <!-- Memanggil library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Memanggil file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div id="login-section" class="container" style="max-width: 400px;">
        <h2>Login Sistem SPP</h2>
        <input type="email" id="email" placeholder="Masukkan Email">
        <input type="password" id="password" placeholder="Masukkan Password">
        <button onclick="login()">Masuk</button>
        <p id="pesan-error" style="color: red;"></p>
    </div>

    <!-- HALAMAN DASHBOARD -->
    <div id="dashboard-section" class="container" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h2>Dashboard Utama</h2>
                <p>Selamat datang, <b id="nama-user">...</b>! (Akses: <span id="role-user" style="background: yellow; padding: 2px 5px;">...</span>)</p>
            </div>
            <button onclick="logout()" class="btn-merah">Logout</button>
        </div>
        <hr>

        <!-- DAFTAR SISWA (Hanya terlihat rapi untuk Guru) -->
        <div id="panel-guru">
            <h3>Daftar Siswa di Kelas Anda:</h3>
            <ul id="daftar-siswa"></ul>
        </div>

        <!-- PANEL KHUSUS ADMIN (Tabel Tagihan & Antrean WA) -->
        <div id="panel-admin" style="display: none; margin-top: 20px;">
            <h3>Daftar Tunggakan SPP</h3>
            <table>
                <thead>
                    <tr>
                        <th style="text-align: center;"><input type="checkbox" id="check-all" onclick="centangSemua()"></th>
                        <th>Nama Siswa</th>
                        <th>Kelas</th>
                        <th>Bulan Tagihan</th>
                        <th>Nominal</th>
                        <th>No. WA Ortu</th>
                    </tr>
                </thead>
                <tbody id="tabel-tunggakan">
                    <!-- Data masuk ke sini via Javascript -->
                </tbody>
            </table>
            
            <button class="btn-biru" onclick="siapkanAntrean()">Tarik Data Centang & Siapkan Antrean WA</button>

            <!-- KOTAK EKSEKUSI ANTREAN -->
            <div id="antrean-panel" style="display: none;">
                <h4>Proses Antrean WhatsApp</h4>
                <p id="status-antrean">Menunggu...</p>
                <button id="btn-kirim-wa" onclick="kirimWaSekarang()" style="background-color: #4CAF50; width: auto; padding: 10px 20px; font-size: 16px; font-weight: bold;">Kirim Pesan Sekarang</button>
                <button onclick="batalAntrean()" class="btn-merah" style="margin-left: 10px;">Batalkan Antrean</button>
            </div>
        </div>
    </div>

    <!-- Memanggil file Javascript eksternal (Harus di bagian paling bawah body) -->
    <script src="app.js"></script>
</body>
</html>
