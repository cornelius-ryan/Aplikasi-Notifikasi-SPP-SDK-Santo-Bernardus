<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem SPP - Santo Bernardus</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css?v=11">
</head>
<body>

    <div id="login-section" class="container modal-login">
        <h2 style="text-align: center; color: #1e293b; margin-bottom: 20px;">Login Sistem SPP</h2>
        <input type="email" id="email" placeholder="Masukkan Email">
        <input type="password" id="password" placeholder="Masukkan Password">
        <button onclick="login()" class="btn-primary" style="margin-top: 15px;">Masuk</button>
        <p id="pesan-error" style="color: #ef4444; text-align: center; font-size: 14px; margin-top: 10px;"></p>
    </div>

    <div id="dashboard-section" class="dashboard-wrapper" style="display:none;">
        
        <aside class="sidebar">
            <h3>Sistem SPP</h3>
            <p>
                Halo, <b id="nama-user">...</b><br>
                <span id="role-user" class="badge-role">...</span>
            </p>
            
            <nav class="menu-navigasi">
                <button id="btn-menu-home" class="menu-btn menu-aktif" onclick="bukaMenu('page-home')">🏠 Dashboard</button>
                <button id="btn-menu-tagihan" class="menu-btn" onclick="bukaMenu('page-tagihan')" style="display: none;">💰 Data Tagihan</button>
                <button id="btn-menu-siswa" class="menu-btn" onclick="bukaMenu('page-siswa')" style="display: none;">🎓 Data Siswa</button>
                <button id="btn-menu-guru" class="menu-btn" onclick="bukaMenu('page-guru')" style="display: none;">👩‍🏫 Data Guru</button>
            </nav>
            
            <div class="spacer"></div>
            <button onclick="logout()" class="btn-logout">🚪 Keluar (Logout)</button>
        </aside>

        <main id="main-content" class="content-area">
            </main>
        
    </div>

    <script src="app.js?v=11"></script>
</body>
</html>
